name: Build and Publish Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for PyPI Trusted Publishing

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --release --out dist -i python3.10 -i python3.11 -i python3.12
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: --release --out dist -i python3.10 -i python3.11 -i python3.12
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --release --out dist
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --release --out dist
          - os: macos-13
            target: x86_64-apple-darwin
            args: --release --out dist

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test_wheels:
    name: Test wheel on ${{ matrix.os }}
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.os }}*
          path: downloaded_wheels
          merge-multiple: true

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy polars pyarrow
          python -m pip install --no-index --find-links downloaded_wheels hydroaj

      - name: Run verification test suite
        run: |
          python tests/run_all_workbook_examples.py
          pytest tests/

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, test_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
